<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>一箭穿两心</title>
<style>
  body {
    margin: 0;
    background: linear-gradient(135deg, #1a0505, #330011, #1a0505);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }
  .container {
    position: relative;
    width: 520px;
    height: 380px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1;
  }
  .glow {
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, rgba(255,51,102,0.25) 0%, transparent 70%);
    z-index: 0;
    animation: pulseGlow 2s infinite alternate;
  }
  @keyframes pulseGlow {
    0% { opacity: 0.5; transform: scale(1); }
    100% { opacity: 1; transform: scale(1.05); }
  }

  /* 更大的爱心基础样式 */
  .heart {
    position: absolute;
    width: 250px;
    height: 235px;
    background: #ff3366;
    transform: rotate(-45deg);
    box-shadow: 0 0 50px #ff3366, inset 0 0 20px rgba(255,255,255,0.3);
    animation: beat 1.2s infinite ease-in-out;
  }
  .heart::before, .heart::after {
    content: '';
    position: absolute;
    width: 250px;
    height: 250px;
    background: #ff3366;
    border-radius: 50%;
    box-shadow: 0 0 50px #ff3366;
  }
  .heart::before { top: -125px; left: 0; }
  .heart::after { top: 0; left: 125px; }
  
  @keyframes beat {
    0%, 100% { transform: rotate(-45deg) scale(1); }
    50% { transform: rotate(-45deg) scale(1.12); }
  }

  .heart-left {
    left: 40px;
    z-index: 2;
    animation-delay: 0s;
  }
  .heart-right {
    right: 40px;
    z-index: 2;
    animation-delay: 0.2s;
  }

  /* 加长箭头，确保两边穿出 */
  .arrow {
    position: absolute;
    width: 420px;
    height: 12px;
    background: linear-gradient(90deg, transparent, #ffd700 10%, #ffd700 90%, transparent);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-2deg);
    z-index: 3;
    box-shadow: 0 0 15px #ffd700;
  }
  .arrow::before {
    content: '';
    position: absolute;
    left: -35px;
    top: -10px;
    width: 0;
    height: 0;
    border-right: 35px solid #ffd700;
    border-top: 16px solid transparent;
    border-bottom: 16px solid transparent;
    filter: drop-shadow(-5px 0 5px rgba(255,215,0,0.5));
  }
  .feather {
    position: absolute;
    right: -45px;
    top: -8px;
    width: 45px;
    height: 28px;
    background: #8b4513;
    clip-path: polygon(0 50%, 100% 0, 100% 100%);
    filter: drop-shadow(5px 0 5px rgba(139,69,19,0.5));
  }

  /* 文字直接附在心的上面（居中覆盖） */
  .tip {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    font-size: 18px;
    line-height: 1.6;
    pointer-events: none;
    z-index: 5;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8), 0 0 20px rgba(255,51,102,0.5);
    font-weight: bold;
    width: 90%;
  }
  .tip-sub {
    font-size: 14px;
    opacity: 0.9;
    margin-top: 5px;
    font-weight: normal;
  }

  /* 告白弹窗 */
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.88);
    z-index: 10;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    padding: 20px;
    box-sizing: border-box;
  }
  .modal.active { display: flex; }
  .modal h2 { margin-bottom: 20px; color: #ff6699; font-size: 22px; }
  .modal textarea {
    width: 86%;
    height: 170px;
    padding: 16px;
    border-radius: 14px;
    border: 2px solid #ff3366;
    background: #222;
    color: #fff;
    resize: none;
    font-size: 20px;
    outline: none;
  }
  .modal button {
    margin-top: 28px;
    padding: 14px 52px;
    font-size: 20px;
    border: none;
    border-radius: 34px;
    background: linear-gradient(135deg, #ff3366, #cc0033);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(255,51,102,0.5);
  }
</style>
</head>
<body>

<div class="container">
  <div class="glow"></div>
  <div class="heart heart-left" id="heartLeft"></div>
  <div class="heart heart-right" id="heartRight"></div>
  <div class="arrow">
    <div class="feather"></div>
  </div>
  
  <!-- 文字叠加在心形正上方 -->
  <div class="tip" id="tipText">
    <div>轻触爱心 · 说出心意</div>
    <div class="tip-sub">长按可修改告白</div>
  </div>
</div>

<div class="modal" id="modal">
  <h2>💘 写下你的告白</h2>
  <textarea id="msg" placeholder="输入想说的话..."></textarea>
  <button onclick="save()">保存</button>
</div>

<script>
  const hearts = [document.getElementById('heartLeft'), document.getElementById('heartRight')];
  const modal = document.getElementById('modal');
  const msg = document.getElementById('msg');
  const tipText = document.getElementById('tipText');
  let timer = null;

  hearts.forEach(h => {
    h.addEventListener('click', () => {
      h.style.opacity = '0.7';
      setTimeout(() => h.style.opacity = '1', 150);
    });
  });

  hearts.forEach(h => {
    h.addEventListener('touchstart', startLongPress);
    h.addEventListener('mousedown', startLongPress);
    h.addEventListener('touchend', clearLongPress);
    h.addEventListener('mouseup', clearLongPress);
    h.addEventListener('touchmove', clearLongPress);
    h.addEventListener('mouseleave', clearLongPress);
  });

  function startLongPress() {
    timer = setTimeout(() => {
      modal.classList.add('active');
      msg.focus();
    }, 600);
  }
  function clearLongPress() {
    clearTimeout(timer);
  }

  function save() {
    const text = msg.value.trim();
    if (text) {
      tipText.innerHTML = `<div>❤️ ${text} ❤️</div><div class="tip-sub">长按可修改告白</div>`;
    }
    modal.classList.remove('active');
  }
</script>

</body>
</html>
